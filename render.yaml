services:
  # ─── Backend Service (Free Tier) ───────────────────────────────────────────
  - type: web
    name: dataport-api
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt

    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

      - key: FRONTEND_URL
        value: https://dataport-dcqi.onrender.com/

  # ─── Frontend Service ───────────────────────────────────────────────────────
  - type: web
    name: dataport
    runtime: static

    rootDir: frontend

    buildCommand: npm install && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: https://dataport-api.onrender.com/
          property: host

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
        