services:
  # ─── Backend Service ────────────────────────────────────────────────────────
  - type: web
    name: dataport-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FRONTEND_URL
        fromStaticSite:
          name: dataport
          property: url
    disk:
      name: connector-storage
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1

  # ─── Frontend Service ───────────────────────────────────────────────────────
  - type: static_site
    name: dataport
    env: node
    buildCommand: npm install && npm run build
    publishDir: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dataport-api
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
